name: CI/CD - Build & Deploy PDF Suite to GitHub Pages

# Automatic triggers disabled to pause auto deployments
on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Quality & validation check job (CI)
  validate:
    name: CI - Code & Asset Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for syntax validation)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Core Web Assets Exist
        run: |
          echo "Checking essential files..."
          for file in index.html style.css script.js; do
            if [ ! -f "$file" ]; then
              echo "Error: Required file '$file' is missing!"
              exit 1
            fi
            echo "✓ Found $file ($(wc -c < "$file") bytes)"
          done

      - name: Validate JavaScript Syntax
        run: |
          echo "Checking JavaScript syntax..."
          node --check script.js
          echo "✓ script.js syntax is valid!"

  # Deployment job to GitHub Pages (CD)
  deploy:
    name: CD - Deploy to GitHub Pages
    needs: validate
    # Only deploy on pushes to master/main or manual dispatch (not on pull requests)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Root directory containing index.html, style.css, and script.js
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
